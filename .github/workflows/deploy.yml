name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy job needs Pages and an OIDC token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI and local development cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests gate the deploy: a broken module contract never reaches the site.
      - run: npm test

      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
